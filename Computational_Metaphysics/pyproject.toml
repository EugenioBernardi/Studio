[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "computational-metaphysics"
version = "0.1.0"
description = "Countermodel-driven philosophical autoformalization benchmark (Isabelle/HOL + LogiKEy)"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.3",
  "anthropic>=0.40",
  "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
diagrams = ["graphviz>=0.20"]

[tool.setuptools]
packages = ["mcp_server", "harness", "export"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "isabelle: requires a local Isabelle installation (skipped otherwise)",
  "network: requires network access to an LLM API (skipped otherwise)",
]
